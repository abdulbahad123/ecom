<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <defs>
    <linearGradient id="hoseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="hoseShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <ellipse cx="140" cy="170" rx="65" ry="10" fill="#0f172a" opacity="0.08"/>
  <g filter="url(#hoseShadow)">
    <!-- Curled Hose Loop -->
    <path d="M100 135 C70 95, 110 50, 150 65 C185 80, 195 125, 160 145 C135 158, 110 145, 125 120" stroke="url(#hoseGrad)" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M100 135 C70 95, 110 50, 150 65 C185 80, 195 125, 160 145 C135 158, 110 145, 125 120" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 6" opacity="0.25" fill="none"/>
    <!-- Brass / Yellow Fittings -->
    <g transform="translate(86, 128) rotate(35)">
      <rect x="0" y="-8" width="16" height="16" rx="2" fill="#f59e0b"/>
      <rect x="16" y="-6" width="10" height="12" rx="1" fill="#cbd5e1"/>
    </g>
    <g transform="translate(132, 115) rotate(-45)">
      <rect x="0" y="-8" width="16" height="16" rx="2" fill="#f59e0b"/>
      <rect x="16" y="-6" width="10" height="12" rx="1" fill="#cbd5e1"/>
    </g>
    <!-- Pressure Spec Tag -->
    <text x="168" y="142" font-family="sans-serif" font-size="6" font-weight="900" fill="#2563eb">R2AT</text>
  </g>
</svg>