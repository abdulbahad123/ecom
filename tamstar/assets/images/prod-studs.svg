<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" fill="none">
  <defs>
    <linearGradient id="steelStud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="studShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <ellipse cx="140" cy="218" rx="65" ry="8" fill="#0f172a" opacity="0.08"/>
  <g filter="url(#studShadow)" transform="translate(10, 15)">
    <!-- Angled Threaded Stud -->
    <g transform="translate(140, 95) rotate(-32)">
      <rect x="-70" y="-8" width="140" height="16" rx="2" fill="url(#steelStud)"/>
      <!-- Grooves -->
      <line x1="-60" y1="-8" x2="-60" y2="8" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="-50" y1="-8" x2="-50" y2="8" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="-40" y1="-8" x2="-40" y2="8" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="30" y1="-8" x2="30" y2="8" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="40" y1="-8" x2="40" y2="8" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="50" y1="-8" x2="50" y2="8" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="60" y1="-8" x2="60" y2="8" stroke="#1e293b" stroke-width="1.5"/>
      
      <!-- Nut 1 -->
      <rect x="-20" y="-16" width="20" height="32" rx="3" fill="#475569"/>
      <!-- Nut 2 -->
      <rect x="5" y="-16" width="20" height="32" rx="3" fill="#334155"/>
      
      <!-- Orange Spec Washer -->
      <circle cx="34" cy="-24" r="8" fill="#f59e0b"/>
      <circle cx="34" cy="-24" r="4" fill="#f8fafc"/>
      <text x="34" y="-22" font-family="sans-serif" font-size="4" font-weight="900" fill="#1e293b" text-anchor="middle">B7</text>
    </g>

    <!-- Secondary Small Bolt Below -->
    <rect x="105" y="152" width="70" height="9" rx="2" fill="#94a3b8"/>
    <rect x="98" y="148" width="9" height="17" rx="2" fill="#475569"/>
  </g>
</svg>