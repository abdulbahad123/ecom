<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <defs>
    <linearGradient id="metalBolt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="fastenerShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <ellipse cx="140" cy="170" rx="65" ry="10" fill="#0f172a" opacity="0.08"/>
  <g filter="url(#fastenerShadow)">
    <!-- Angled Stud Bolt -->
    <g transform="translate(140, 100) rotate(-35)">
      <!-- Threaded Rod -->
      <rect x="-65" y="-7" width="130" height="14" rx="2" fill="url(#metalBolt)"/>
      <!-- Thread grooves -->
      <line x1="-55" y1="-7" x2="-55" y2="7" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="-45" y1="-7" x2="-45" y2="7" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="-35" y1="-7" x2="-35" y2="7" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="-25" y1="-7" x2="-25" y2="7" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="25" y1="-7" x2="25" y2="7" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="35" y1="-7" x2="35" y2="7" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="45" y1="-7" x2="45" y2="7" stroke="#1e293b" stroke-width="1.5"/>
      <line x1="55" y1="-7" x2="55" y2="7" stroke="#1e293b" stroke-width="1.5"/>
      <!-- Nut 1 -->
      <rect x="-15" y="-14" width="18" height="28" rx="2" fill="#475569"/>
      <polygon points="-15,-14 -9,-17 3,-17 3,17 -9,17 -15,14" fill="#64748b"/>
      <!-- Nut 2 -->
      <rect x="5" y="-14" width="18" height="28" rx="2" fill="#334155"/>
      <!-- Washers -->
      <circle cx="28" cy="-22" r="6" fill="#f59e0b"/>
      <circle cx="28" cy="-22" r="3" fill="#f8fafc"/>
    </g>
    <!-- Secondary bolt lying flat -->
    <rect x="110" y="145" width="60" height="8" rx="1.5" fill="#94a3b8"/>
    <rect x="105" y="142" width="7" height="14" rx="1.5" fill="#475569"/>
  </g>
</svg>