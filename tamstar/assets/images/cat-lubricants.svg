<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <defs>
    <linearGradient id="drumBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="drumTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="drumShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <ellipse cx="140" cy="172" rx="55" ry="10" fill="#0f172a" opacity="0.08"/>
  <g filter="url(#drumShadow)">
    <!-- Drum Body -->
    <rect x="105" y="60" width="70" height="100" rx="6" fill="url(#drumBlue)"/>
    <!-- Drum Ribs -->
    <line x1="105" y1="88" x2="175" y2="88" stroke="#1e3a8a" stroke-width="3"/>
    <line x1="105" y1="130" x2="175" y2="130" stroke="#1e3a8a" stroke-width="3"/>
    <!-- Yellow Product Label -->
    <rect x="105" y="96" width="70" height="26" fill="#f59e0b"/>
    <text x="140" y="112" font-family="sans-serif" font-size="8.5" font-weight="900" fill="#1e293b" text-anchor="middle" letter-spacing="1">VG 320</text>
    <!-- Drum Top Rim -->
    <ellipse cx="140" cy="60" rx="35" ry="10" fill="url(#drumTop)"/>
    <ellipse cx="140" cy="60" rx="33" ry="8" fill="#1e3a8a"/>
    <!-- Bung Plugs -->
    <circle cx="155" cy="59" r="3.5" fill="#cbd5e1"/>
    <circle cx="125" cy="61" r="2" fill="#cbd5e1"/>
    <!-- Bottom Rim -->
    <ellipse cx="140" cy="160" rx="35" ry="8" fill="#1e3a8a" opacity="0.5"/>
  </g>
</svg>