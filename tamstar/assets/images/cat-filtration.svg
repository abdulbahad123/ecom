<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <defs>
    <linearGradient id="capMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="pleatsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="filterShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <ellipse cx="140" cy="172" rx="55" ry="10" fill="#0f172a" opacity="0.08"/>
  <g filter="url(#filterShadow)">
    <!-- Filter Pleated Cylinder -->
    <rect x="110" y="58" width="60" height="98" fill="url(#pleatsGrad)"/>
    <!-- Vertical Pleat Lines -->
    <line x1="116" y1="58" x2="116" y2="156" stroke="#b45309" stroke-width="1.5"/>
    <line x1="122" y1="58" x2="122" y2="156" stroke="#b45309" stroke-width="1.5"/>
    <line x1="128" y1="58" x2="128" y2="156" stroke="#b45309" stroke-width="1.5"/>
    <line x1="134" y1="58" x2="134" y2="156" stroke="#b45309" stroke-width="1.5"/>
    <line x1="140" y1="58" x2="140" y2="156" stroke="#b45309" stroke-width="1.5"/>
    <line x1="146" y1="58" x2="146" y2="156" stroke="#b45309" stroke-width="1.5"/>
    <line x1="152" y1="58" x2="152" y2="156" stroke="#b45309" stroke-width="1.5"/>
    <line x1="158" y1="58" x2="158" y2="156" stroke="#b45309" stroke-width="1.5"/>
    <line x1="164" y1="58" x2="164" y2="156" stroke="#b45309" stroke-width="1.5"/>
    <!-- Center Mesh Wrap -->
    <rect x="110" y="98" width="60" height="16" fill="#1e293b" opacity="0.9"/>
    <text x="140" y="109" font-family="sans-serif" font-size="6.5" font-weight="900" fill="#ffffff" text-anchor="middle">10 µm</text>
    <!-- Top Metal End-Cap -->
    <ellipse cx="140" cy="58" rx="32" ry="8" fill="url(#capMetal)"/>
    <ellipse cx="140" cy="58" rx="14" ry="4" fill="#1e293b"/>
    <!-- Bottom Metal End-Cap -->
    <ellipse cx="140" cy="156" rx="32" ry="8" fill="url(#capMetal)"/>
  </g>
</svg>