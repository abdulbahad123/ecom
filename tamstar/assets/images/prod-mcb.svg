<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" fill="none">
  <defs>
    <linearGradient id="mcbBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="switchOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="mcbShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <ellipse cx="140" cy="218" rx="60" ry="8" fill="#0f172a" opacity="0.08"/>
  <g filter="url(#mcbShadow)">
    <!-- MCB Main DIN Body -->
    <rect x="95" y="35" width="90" height="170" rx="10" fill="url(#mcbBody)" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Top Terminal Screws -->
    <circle cx="115" cy="52" r="6" fill="#94a3b8"/>
    <circle cx="140" cy="52" r="6" fill="#94a3b8"/>
    <circle cx="165" cy="52" r="6" fill="#94a3b8"/>
    <line x1="112" y1="52" x2="118" y2="52" stroke="#475569" stroke-width="1.5"/>
    <line x1="137" y1="52" x2="143" y2="52" stroke="#475569" stroke-width="1.5"/>
    <line x1="162" y1="52" x2="168" y2="52" stroke="#475569" stroke-width="1.5"/>

    <!-- Indicator Window -->
    <rect x="105" y="76" width="12" height="6" rx="1.5" fill="#2563eb"/>

    <!-- Center Switch Well -->
    <rect x="122" y="88" width="36" height="64" rx="4" fill="#0f172a"/>
    <!-- Orange Toggle Switch (ON position) -->
    <rect x="125" y="94" width="30" height="34" rx="3" fill="url(#switchOrange)"/>
    <text x="140" y="115" font-family="sans-serif" font-size="7" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">ON |</text>

    <!-- Rating Specs -->
    <text x="140" y="172" font-family="sans-serif" font-size="7.5" font-weight="800" fill="#2563eb" text-anchor="middle">253A</text>
    <text x="140" y="182" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#64748b" text-anchor="middle">32A 230/400V~</text>

    <!-- Bottom Terminal Screws -->
    <circle cx="115" cy="194" r="6" fill="#94a3b8"/>
    <circle cx="140" cy="194" r="6" fill="#94a3b8"/>
    <circle cx="165" cy="194" r="6" fill="#94a3b8"/>
  </g>
</svg>