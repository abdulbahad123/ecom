<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" fill="none">
  <defs>
    <linearGradient id="hoseSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="hoseGlow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <ellipse cx="140" cy="218" rx="65" ry="8" fill="#0f172a" opacity="0.08"/>
  <g filter="url(#hoseGlow)" transform="translate(10, 10)">
    <!-- Outer Coiled Loop -->
    <path d="M95 155 C55 105, 105 45, 155 65 C198 82, 205 138, 165 162 C135 178, 105 160, 125 130" stroke="url(#hoseSkin)" stroke-width="26" stroke-linecap="round" fill="none"/>
    <path d="M95 155 C55 105, 105 45, 155 65 C198 82, 205 138, 165 162 C135 178, 105 160, 125 130" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 5" opacity="0.3" fill="none"/>

    <!-- Gold Fitting End 1 -->
    <g transform="translate(80, 148) rotate(35)">
      <rect x="0" y="-10" width="20" height="20" rx="3" fill="#f59e0b"/>
      <rect x="20" y="-8" width="12" height="16" rx="2" fill="#cbd5e1"/>
    </g>

    <!-- Gold Fitting End 2 -->
    <g transform="translate(135, 122) rotate(-45)">
      <rect x="0" y="-10" width="20" height="20" rx="3" fill="#f59e0b"/>
      <rect x="20" y="-8" width="12" height="16" rx="2" fill="#cbd5e1"/>
    </g>

    <text x="182" y="162" font-family="sans-serif" font-size="8" font-weight="900" fill="#2563eb">R2AT</text>
  </g>
</svg>