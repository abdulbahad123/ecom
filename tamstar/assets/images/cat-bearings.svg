<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <defs>
    <linearGradient id="outerRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="brassCage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ballShine" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="bearingShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <ellipse cx="140" cy="172" rx="75" ry="10" fill="#0f172a" opacity="0.08"/>
  <g filter="url(#bearingShadow)">
    <!-- Outer Ring -->
    <circle cx="140" cy="100" r="68" fill="url(#outerRing)"/>
    <circle cx="140" cy="100" r="63" fill="#334155"/>
    <circle cx="140" cy="100" r="60" fill="url(#brassCage)"/>
    <circle cx="140" cy="100" r="42" fill="#1e293b"/>
    <!-- Inner Ring -->
    <circle cx="140" cy="100" r="38" fill="url(#outerRing)"/>
    <circle cx="140" cy="100" r="26" fill="#f8fafc"/>
    <text x="140" y="58" font-family="sans-serif" font-size="6" font-weight="700" fill="#78350f" text-anchor="middle">2RS</text>
    <!-- Steel Balls -->
    <circle cx="140" cy="49" r="8" fill="url(#ballShine)"/>
    <circle cx="176" cy="64" r="8" fill="url(#ballShine)"/>
    <circle cx="191" cy="100" r="8" fill="url(#ballShine)"/>
    <circle cx="176" cy="136" r="8" fill="url(#ballShine)"/>
    <circle cx="140" cy="151" r="8" fill="url(#ballShine)"/>
    <circle cx="104" cy="136" r="8" fill="url(#ballShine)"/>
    <circle cx="89" cy="100" r="8" fill="url(#ballShine)"/>
    <circle cx="104" cy="64" r="8" fill="url(#ballShine)"/>
  </g>
</svg>