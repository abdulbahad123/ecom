<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <defs>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="brimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="hatShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <ellipse cx="140" cy="168" rx="85" ry="12" fill="#0f172a" opacity="0.08"/>
  <g filter="url(#hatShadow)">
    <!-- Helmet Dome -->
    <path d="M60 140 C60 70, 95 48, 140 48 C185 48, 220 70, 220 140 Z" fill="url(#hatGrad)"/>
    <!-- Top Ridge -->
    <path d="M125 48 C130 38, 150 38, 155 48 L152 135 L128 135 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Badge -->
    <rect x="118" y="115" width="44" height="15" rx="3" fill="#1e3a8a"/>
    <text x="140" y="126" font-family="sans-serif" font-size="7.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">SAFETY</text>
    <!-- Helmet Brim / Visor -->
    <path d="M45 140 C45 130, 235 130, 235 140 C235 152, 45 152, 45 140 Z" fill="url(#brimGrad)"/>
    <ellipse cx="140" cy="144" rx="92" ry="5" fill="#94a3b8" opacity="0.4"/>
  </g>
</svg>